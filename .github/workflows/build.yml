name: Build Sprout
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Restore optional release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE" ]; then
            python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path('android/app/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE']))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          props = {'storeFile': 'release.jks', 'storePassword': os.environ['STORE_PASSWORD'], 'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          pathlib.Path('android/key.properties').write_text('\n'.join(f'{key}={escape(value)}' for key, value in props.items()))
          PY
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sprout-android
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows portable app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sprout-windows.zip
      - name: Check extracted Windows portable app
        shell: pwsh
        run: |
          $sproutProbe = Join-Path $env:RUNNER_TEMP 'sprout-portable-check'
          Expand-Archive sprout-windows.zip -DestinationPath $sproutProbe
          foreach ($required in @('sprout.exe', 'flutter_windows.dll', 'sqlite3.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'LICENSE-Sprout.txt', 'LICENSE-Nunito.txt', 'data/flutter_assets/assets/fonts/OFL.txt', 'data/app.so')) {
            if (-not (Test-Path (Join-Path $sproutProbe $required))) { throw "Missing portable file: $required" }
          }
          $sproutProcess = Start-Process (Join-Path $sproutProbe 'sprout.exe') -ArgumentList '--tray' -WorkingDirectory $sproutProbe -PassThru
          try {
            Start-Sleep -Seconds 10
            $sproutProcess.Refresh()
            if ($sproutProcess.HasExited) { throw "Sprout exited during startup: $($sproutProcess.ExitCode)" }
            $sproutData = Join-Path $env:APPDATA 'dev.beesan/Sprout/timebud.sqlite'
            if (-not (Test-Path $sproutData)) { throw 'Sprout did not initialize its database' }
            @'
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute("SELECT count(*) FROM metadata WHERE key IN ('deviceId','deviceName')").fetchone()[0] == 2
          print('Portable Windows startup and SQLite integrity passed')
          '@ | python - $sproutData
            if ($LASTEXITCODE -ne 0) { throw 'Windows persistence check failed' }
          } finally {
            if (-not $sproutProcess.HasExited) { Stop-Process -Id $sproutProcess.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: sprout-windows
          path: sprout-windows.zip
          if-no-files-found: error
