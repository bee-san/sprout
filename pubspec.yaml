name: sprout
description: Friendly offline time tracking for Android and Windows.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  uuid: ^4.6.0
  http: ^1.6.0
  crypto: ^3.0.7
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
